name: Fujify
options:
  bundleIdPrefix: dev.josephsintum
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
targets:
  Fujify:
    type: application
    platform: macOS
    sources:
      - FujifyApp.swift
      - ContentView.swift
      - path: Engine
      - path: Models
      - path: Views
      - Assets.xcassets
      # Bundled command-line tools, so a fresh install needs no setup.
      # Populated by tools/fetch-tools.sh and gitignored; the app falls back
      # to a Homebrew copy when they are absent. exiftool is a folder
      # reference because the script has to keep its lib/ beside it.
      - path: Vendor/exiftool
        type: folder
        optional: true
      # Extensionless, so xcodegen needs telling that it is a resource;
      # otherwise it lands in the project but never in the bundle.
      - path: Vendor/dnglab
        buildPhase: resources
        optional: true
      # Shared with the Windows and web implementations; see
      # docs/PIPELINE-CONTRACT.md §3.2. Lives outside mac/ deliberately.
      - path: ../tools/exiftool-fujify.config
      - path: Vendor/LICENSES
        type: folder
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: dev.josephsintum.fujify
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Fujify
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Joseph Sintum. Original Fujify © 2024 Isidore Paulin. GPL v3."
  FujifyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Fujify
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_BUNDLE_IDENTIFIER: dev.josephsintum.fujify.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Fujify:
    build:
      targets:
        Fujify: all
        FujifyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - FujifyTests
